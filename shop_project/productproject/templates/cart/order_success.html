{% extends 'base.html' %}

{% block title %}Заказ оформлен — VINYL{% endblock %}

{% block extra_styles %}
<style>
    .success-page {
        text-align: center;
        padding: 120px 20px;
        max-width: 700px;
        margin: 80px auto;
    }
    .success-page h1 {
        font-size: 2.8rem;
        color: #ffffff;
        margin-bottom: 20px;
    }
    .success-page p {
        font-size: 1.3rem;
        color: #aaa;
        margin-bottom: 40px;
    }
    .btn-home {
        background: #ffffff;
        color: #000;
        padding: 15px 40px;
        font-size: 1.1rem;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
    <div class="success-page">
        <h1>Заказ успешно оформлен!</h1>
        <p>Спасибо за доверие! Мы свяжемся с вами в ближайшее время.</p>
        <a href="{% url 'productproject:home' %}" class="btn-home">Вернуться на главную</a>
    </div>
{% endblock %}

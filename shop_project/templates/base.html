{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VINYL STORE{% endblock %}</title>

    <link href="{% static 'bootstrap-5.3.8-dist/css/bootstrap.min.css' %}" rel="stylesheet">

<style>
    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
    }

    body { 
        font-family: Arial, sans-serif; 
        background: #0f0f0f; 
        color: #e0e0e0; 
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header { 
        background: #000; 
        padding: 18px 0; 
        text-align: center; 
        border-bottom: 1px solid #333; 
    }

    .auth-buttons {
        position: absolute;
        right: 30px;
        top: 20px;
    }

    .btn-login, .btn-register, .btn-logout {
        padding: 8px 18px;
        border-radius: 4px;
        text-decoration: none;
        font-weight: bold;
        margin-left: 10px;
    }

    .btn-login {
        background: #333;
        color: #fff;
        border: 1px solid #555;
    }

    .btn-register {
        background: #ffffff;
        color: #000;
    }

    .btn-logout {
        background: #808080;
        color: #fff;
    }
    
    nav a { 
        color: #fff; 
        margin: 0 18px; 
        text-decoration: none; 
    }

    nav a:hover { color: #aaa; }

    main { 
        flex: 1 0 auto; 
        padding: 20px 0;
    }

    .container { 
        max-width: 1300px; 
        margin: 0 auto; 
        padding: 0 20px;
    }

    h1 { 
        text-align: center; 
        margin: 40px 0 25px; 
        font-size: 2.5rem; 
    }

    footer {
        background: #0a0a0a;
        color: #666;
        text-align: center;
        padding: 16px 0;
        font-size: 0.9rem;
        border-top: 1px solid #222;
        margin-top: auto;
    }

    .card h5,
    .card h6,
    .card-title,
    .card .card-title,
    .card strong,
    .product-name,
    [class*="title"],
    .card div:first-child,
    .card p:first-of-type {
        color: #ffffff !important;
        font-weight: 600 !important;
    }
</style>
</style>

    {% block extra_styles %}{% endblock %}
</head>
<body>
    {% include "_inc/_header.html" %}

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    {% include "_inc/_footer.html" %}

</body>
</html>
